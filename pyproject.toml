[project]
name = "public-exam-alerts"
version = "0.1.0"
description = "Segmented WhatsApp alerts for Brazilian public service exams (concursos)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
python_files = ["tests_smoke.py"]
